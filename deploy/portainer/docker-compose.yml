services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Portainer}
      POSTGRES_DB: ${POSTGRES_DB:-gestao_financeira}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gestao_financeira}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${WEB_PORT:-4000}:3000"

  api:
    image: ghcr.io/domingos-filho/gestao-financeira-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-gestao_financeira}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no Portainer}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Defina REFRESH_TOKEN_SECRET no Portainer}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-fadomingosf@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no Portainer}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    command:
      - sh
      - -c
      - |
        attempt=0
        until node -e "const net = require('net'); const socket = net.createConnection({ host: '127.0.0.1', port: 5432 }, () => { console.log('PostgreSQL acessivel em 127.0.0.1:5432'); socket.end(); process.exit(0); }); socket.on('error', (error) => { console.error('Falha TCP em 127.0.0.1:5432: ' + error.code + ' - ' + error.message); process.exit(1); }); socket.setTimeout(2000, () => { console.error('Timeout TCP em 127.0.0.1:5432'); socket.destroy(); process.exit(1); });"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "PostgreSQL indisponivel em 127.0.0.1:5432 apos 120 segundos."
            exit 1
          fi
          echo "Aguardando PostgreSQL em 127.0.0.1:5432... tentativa $$attempt/60"
          sleep 2
        done
        npm run prisma:migrate
        exec node dist/main.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/domingos-filho/gestao-financeira-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PUBLIC_URL: http://127.0.0.1:3001
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    network_mode: "service:postgres"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: http2
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    network_mode: host

volumes:
  pgdata:
